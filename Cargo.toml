[workspace]
resolver = "3"
members = ["crates/nocve-proto", "crates/nocved", "crates/nocve-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
nocve-proto = { path = "crates/nocve-proto" }
nocved = { path = "crates/nocved", features = ["testutil"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
hmac = "0.12.1"
subtle = "2.6.1"
getrandom = { version = "0.3.4", features = ["std"] }
hex = "0.4.3"
libc = "0.2.188"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
tiny_http = { version = "0.12.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# unwind, not abort: nocve-store wraps every request in catch_unwind so one
# panicking handler cannot kill the collector (finding C1). nocved restores
# abort-on-panic with a panic hook in its main().
panic = "unwind"
